# DawnPatrol deployment. Copy .env.example to .env and fill it in.
#
#   docker compose run --rm dawnpatrol validate          # check config
#   docker compose run --rm dawnpatrol list-plugins      # what is enabled
#   docker compose run --rm dawnpatrol probe             # test connectivity
#   docker compose run --rm dawnpatrol run --stop-after analyze   # no API spend
#   docker compose up -d                               # start the scheduler

services:
  dawnpatrol:
    build: .
    image: dawnpatrol:latest
    container_name: dawnpatrol
    restart: unless-stopped
    env_file: .env
    environment:
      DAWNPATROL_DATA_DIR: /var/lib/dawnpatrol
      DAWNPATROL_OUTPUT_DIR: /out
      DAWNPATROL_PROFILE: /etc/dawnpatrol/profile.yml
    volumes:
      - dawnpatrol-data:/var/lib/dawnpatrol          # databases; must persist
      - ./out:/out                               # reports - see README: Permissions
      - ./config/profile.yml:/etc/dawnpatrol/profile.yml:ro
    # DawnPatrol reaches your monitoring hosts, its reputation APIs, and its model
    # provider. It never listens. Add an egress allowlist here if you firewall
    # outbound traffic.

volumes:
  dawnpatrol-data:
