[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dawnpatrol"
version = "0.1.0"
description = "Scheduled, pluggable network threat-hunting pipeline with an AI analysis harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nick Leghorn" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "croniter>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mysql = ["PyMySQL>=1.1"]
all = ["anthropic>=0.40", "PyMySQL>=1.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
dawnpatrol = "dawnpatrol.cli:main"

[tool.setuptools.packages.find]
include = ["dawnpatrol*"]

[tool.setuptools.package-data]
dawnpatrol = ["agent/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:dawnpatrol.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
